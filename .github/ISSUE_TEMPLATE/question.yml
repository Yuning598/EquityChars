name: Question
description: Ask a question about data construction, documentation, or releases.
title: "Question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please include enough context to reproduce or understand the question.
  - type: dropdown
    id: dataset
    attributes:
      label: Dataset
      options:
        - Equity Characteristics
        - Corporate Bond Data
        - Website or documentation
        - Other
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release ID
      description: Use YYYY-MM if the question concerns a specific data release.
      placeholder: "2026-04"
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe the issue, characteristic, file, or formula involved.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, screenshots, code snippets, or expected behavior if useful.
