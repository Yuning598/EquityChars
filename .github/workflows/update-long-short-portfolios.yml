name: Update long-short portfolios

on:
  workflow_dispatch:
    inputs:
      parquet_url:
        description: Dropbox URL for chars_raw_no_impute.parquet
        required: true
        default: "https://www.dropbox.com/scl/fi/3nvq1zj9h7oij4is3nnud/chars_raw_no_impute.parquet?rlkey=2d0e99n8lws3frr4a7hgtq7ns&st=z2wbzjez&dl=0"
      release_id:
        description: Data release shown on the site
        required: true
        default: "2026-04"
      update_mode:
        description: Use incremental for monthly updates; use full after historical revisions or direction changes
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
      characteristics:
        description: Optional space- or comma-separated acronyms for partial recomputation
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-portfolios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas pyarrow
      - name: Build long-short portfolio summary
        run: |
          extra_args=()
          if [ -n "${{ inputs.characteristics }}" ]; then
            extra_args+=(--characteristics ${{ inputs.characteristics }})
          fi
          python scripts/build_long_short_portfolios.py \
            --source "${{ inputs.parquet_url }}" \
            --release-id "${{ inputs.release_id }}" \
            --dataset-label chars_raw_no_impute \
            --update-mode "${{ inputs.update_mode }}" \
            --workers 2 \
            --directions documents/signal_directions.csv \
            --output chars/data/equity_long_short_raw_no_impute.json \
            "${extra_args[@]}"
      - name: Validate generated portfolio summary
        run: |
          python scripts/validate_long_short_json.py \
            --input chars/data/equity_long_short_raw_no_impute.json \
            --expected-characteristics 98 \
            --require-quantiles 5 10 \
            --directions documents/signal_directions.csv
      - name: Commit portfolio summary
        run: |
          if git diff --quiet -- chars/data/equity_long_short_raw_no_impute.json; then
            echo "No long-short portfolio changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chars/data/equity_long_short_raw_no_impute.json
          git commit -F - <<'EOF'
          Refresh long-short portfolio data for the selected equity release

          The website reads precomputed JSON so visitors can inspect long-short
          portfolio paths without downloading the full parquet panel. The workflow
          supports monthly incremental appends and targeted full-history recomputation
          when directions or individual characteristic definitions change.

          Constraint: Large WRDS-derived parquet files are supplied through the workflow input URL
          Confidence: medium
          Scope-risk: moderate
          Directive: Use the characteristics input for direction-only fixes to avoid full 98-signal recomputation
          Tested: Workflow command completed in GitHub Actions
          Not-tested: Local visual inspection of the rendered chart
          EOF
